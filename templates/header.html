<!-- templates/header.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>{% block title %}FiscalBoard{% endblock %}</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light">
    <div  class="navbar-containaer" ></div>
    <a href="{{ url_for('home') }}">
    <img class="logo" src="static/f_b_icon.png" alt="FiscalBoard Logo"/>
    </a>
    <button class="navbar-home navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
        {% if current_user %}
            <ul class="navbar-nav mr-auto"> 
                <li class="nav-item">
                    <a href="{{ url_for('home') }}" class="nav-link">Inicio</a> 
                </li>
                <li class="nav-item">
                    <button id="logoutButton" class="btn btn-link nav-link">Cerrar sesión</button>
                </li>
            </ul>
            <h4 class="ml-auto">{{ current_user.usuario }}</h4>        
        {% else %} 
        <ul class="navbar-nav mr-auto"> 
            <li class="nav-item">
                <a href="{{ url_for('login') }}" class="btn btn-link nav-link">Ingresar</a> <!-- Botón para Ingresar -->
            </li>
        </ul>   
            
        {% endif %}
    </div>
    
</nav>

<script>
    document.getElementById('logoutButton').addEventListener('click', function() {
        fetch('{{ url_for('logout') }}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-Token': '{{ csrf_token() }}'  // Incluye el token CSRF en los encabezados
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Error al cerrar sesión');
            }
            return response.json();
        })
        .then(data => {
            if (data.success) {
                window.location.href = '/';  // Redirige a la página principal
            }
        })
        .catch(error => {
            alert(error.message);  // Muestra el mensaje de error
        });
    });
</script>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
