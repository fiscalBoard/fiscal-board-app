<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Login</title>
</head>
<body>
    {% include 'header.html' %}
    <div class="container">
        <h2 class="mt-5">Iniciar sesión</h2>
        <form id="loginForm">
            
            <div class="form-group">
                <label for="usuario">Nombre de Usuario:</label>
                <input type="text" class="form-control" id="usuario" name="usuario" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="registrar-container">
                <button type="submit" class="btn btn-primary">Iniciar sesión</button>
            </div>
        </form>
        <div class="registrar-container">
            <p class="mt-3"><a href="{{ url_for('register') }}">Registrarme</a></p>
            <p class="mt-3"><a href="{{ url_for('forgot_password') }}">¿Olvidaste tu contraseña?</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();  // Evita el envío normal del formulario
            fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': '{{ csrf_token() }}'  // Incluye el token CSRF en los encabezados
                },
                body: JSON.stringify({  // Convierte el objeto a una cadena JSON
                    usuario: document.getElementById('usuario').value,
                    password: document.getElementById('password').value
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Credenciales incorrectas');
                }
                return response.json();
            })
            .then(data => {
                //alert(data.message);
                if (data.success) {
                    window.location.href = '/';  // Redirige a la página principal
                }
            })
            .catch(error => {
                alert(error.message);  // Muestra el mensaje de error
            });

             
        });
    </script>
</body>
</html>
