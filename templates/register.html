<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"> <!-- Font Awesome -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">  <!-- Vinculación al CSS -->
    
    <title>Registro de Negocio</title>
</head>
<body>
    {% include 'header.html' %}
    <div class="container">
        <h2 class="mt-5">Registro de Negocio</h2>
        <form class="registration" id="registrationForm">
            {% if error %}
            <script>
                alert('{{error}}');
            </script>
            {% endif %}
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="usuario">Nombre de Usuario:</label>
                        <input type="text" class="form-control" id="usuario" name="usuario" required>
                    </div>
                    <div class="form-group">
                        <label for="correo_negocio">Correo Electrónico:</label>
                        <input type="email" class="form-control" id="correo_negocio" name="correo_negocio" required>
                    </div>
                    <div class="form-group">
                        <label for="nombre_negocio">Nombre del Negocio:</label>
                        <input type="text" class="form-control" id="nombre_negocio" name="nombre_negocio" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="tipo_negocio">Tipo de Negocio:</label>
                        <select class="form-control" id="tipo_negocio" name="tipo_negocio" required>
                            <option value="Comercio">Comercio</option>
                            <option value="Servicio">Servicio</option>
                            <option value="Industria">Industria</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="rif">RIF</label>
                        <input type="text" class="form-control" id="rif" name="rif" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono:</label>
                        <input type="text" class="form-control" id="telefono" name="telefono">
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="direccion">Dirección:</label>
                <input type="text" class="form-control" id="direccion" name="direccion" required>
            </div>
            <div class="registrar-container">
                <div class="form-group password">
                    <label for="password">Contraseña:</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" name="password" required>
                        <span class="show-password" onclick="togglePasswordVisibility('password')"><i class="fas fa-eye"></i></span>
                    </div>
                </div>
                <div class="form-group password">
                    <label for="password_repeat">Repetir Contraseña:</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password_repeat" name="password_repeat" required>
                        <span class="show-password" onclick="togglePasswordVisibility('password_repeat')"><i class="fas fa-eye"></i></span>
                    </div>
                </div>
            </div>
            <div class="registrar-container">
                <button type="submit" class="btn btn-primary">Registrar</button>
            </div>
        </form>
    </div>

    <script>
        function togglePasswordVisibility(passwordFieldId) {
            const passwordField = document.getElementById(passwordFieldId);
            const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordField.setAttribute('type', type);
        }

        document.getElementById('registrationForm').addEventListener('submit', function(event) {
            const password = document.getElementById('password').value;
            const passwordRepeat = document.getElementById('password_repeat').value;

            if (password !== passwordRepeat) {
                event.preventDefault();
                alert('Las contraseñas no coinciden.');
            } else {
                event.preventDefault(); // Evita el envío normal del formulario

                const formData = {
                    usuario: document.getElementById('usuario').value,
                    correo_negocio: document.getElementById('correo_negocio').value,
                    nombre_negocio: document.getElementById('nombre_negocio').value,
                    tipo_negocio: document.getElementById('tipo_negocio').value,
                    rif: document.getElementById('rif').value,
                    telefono: document.getElementById('telefono').value,
                    direccion: document.getElementById('direccion').value,
                    password: password
                };

                fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': '{{ csrf_token() }}'  // Incluye el token CSRF en los encabezados
                    },
                    body: JSON.stringify(formData)
                })
                .then(response => {
                    console.log(`DATA RESPONSE ${response}`)
                    if (!response.ok) {
                        throw new Error('Error al registrar el negocio');
                    }
                    return response.json();
                })
                .then(data => {
                    //alert(data.message);  // Muestra el mensaje de éxito o error
                    if (data.success) {
                        window.location.href = '/';  // Redirige a la página principal o a otra página
                    }
                })
                .catch(error => {
                    alert(error.message);  // Muestra el mensaje de error
                });
            }
        });
    </script>
</body>
</html>
